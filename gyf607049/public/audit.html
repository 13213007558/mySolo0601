<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<link rel="stylesheet" href="/style.css">
</head>
<body>
<header>
  <h1>🏥 审计中心</h1>

<main>

      <label>

          <th>详情</th>

      </thead>
      <tbody id="auditBody"></tbody>

<script src="/app.js"></script>
<script>initAuditPage();</script>
