[package]
name = "escapement_amplitude_station"
version = "0.1.0"
edition = "2021"
description = "擒纵摆幅Mic台 - 腕表售后振幅检测系统"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew = { version = "0.21", features = ["csr"] }
yew-router = "0.18"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "AudioContext",
    "MediaStream",
    "MediaStreamConstraints",
    "MediaStreamTrack",
    "Navigator",
    "Window",
    "AnalyserNode",
    "AudioNode",
    "MediaStreamAudioSourceNode",
    "HtmlCanvasElement",
    "CanvasRenderingContext2d",
    "DomRect",
    "HtmlInputElement",
    "HtmlSelectElement",
    "HtmlAnchorElement",
    "Blob",
    "BlobPropertyBag",
    "Url",
    "Document",
    "MediaDevices",
    "HtmlDivElement",
    "HtmlElement",
    "console",
] }
gloo-console = "0.2"
gloo-storage = "0.3"
gloo-timers = "0.3"
chrono = { version = "0.4", features = ["serde", "clock"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
csv = "1.3"
base64 = "0.22"

[dev-dependencies]
wasm-bindgen-test = "0.3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
